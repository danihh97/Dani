<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puerto Faro — Marina Tycoon</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14304a;--panel:#fff;--accent:#ff6f59;--gold:#ffc83d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f2f8fc;--panel:#1d3b57}}
:root[data-theme="dark"]{--ink:#f2f8fc;--panel:#1d3b57}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:#8fdcea;font-family:'Fredoka',ui-rounded,system-ui,sans-serif;color:var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;gap:6px;pointer-events:none}
.pill{background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;box-shadow:0 4px 14px rgba(10,40,70,.28);border:1px solid rgba(255,255,255,.5)}
#goal{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 50px);height:22px;background:rgba(255,255,255,.6);border-radius:11px;overflow:hidden;pointer-events:none}
#gf{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#ffb020,#ffd866);transition:width .3s}
#gt{position:relative;display:block;text-align:center;font-weight:700;font-size:13px;line-height:22px;color:#14304a}
#ts{position:fixed;z-index:6;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 80px);text-align:center;background:var(--panel);color:var(--ink);border-radius:14px;padding:8px 12px;font-weight:700;font-size:14px;box-shadow:0 2px 0 rgba(0,0,0,.25);pointer-events:none}
#ts[hidden]{display:none}
#bar{position:fixed;z-index:5;left:6px;right:6px;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
#bar button{border:1px solid rgba(255,255,255,.5);border-radius:16px;padding:7px 1px 8px;background:var(--panel);color:var(--ink);font:inherit;font-weight:500;font-size:11px;line-height:1.25;box-shadow:0 6px 16px rgba(10,40,70,.3)}
#bar button b{display:block;font-size:20px;font-weight:400}
#bar button.on{background:var(--gold);color:#14304a}
#bar button:disabled{opacity:.5}
#bar button:focus-visible,#ob:focus-visible,.coin:focus-visible{outline:3px solid #fff}
.coin{position:fixed;z-index:3;transform:translate(-50%,-50%);border:0;border-radius:999px;background:var(--gold);color:#14304a;font:inherit;font-weight:700;font-size:15px;padding:6px 10px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.coin.fire{background:#ff4b3a;color:#fff}
#ov{position:fixed;z-index:4;inset:0 0 84px 0;display:flex;align-items:center;justify-content:center;background:rgba(20,48,74,.5);padding:20px}
#ov[hidden]{display:none}
#pn{background:var(--panel);border-radius:22px;padding:22px;max-width:330px;text-align:center}
#oh{margin:0 0 8px;font-size:28px}
#op{margin:0 0 16px;line-height:1.4;font-weight:500}
#ob{border:0;border-radius:14px;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:18px;padding:10px 26px;box-shadow:0 3px 0 rgba(0,0,0,.25)}

/* PUERTO FARO — capa visual profesional */
:root{--ink:#102d43;--panel:rgba(248,253,255,.94);--accent:#ff765f;--gold:#ffd166}
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap');
html,body{font-family:Manrope,ui-rounded,system-ui,sans-serif;background:#78cbdc}
#c{filter:saturate(1.06) contrast(1.025)}
#hud{left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);gap:8px;align-items:center}
.pill{background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(232,248,252,.93));border:1px solid rgba(255,255,255,.9);border-radius:15px;padding:9px 13px;font-size:14px;letter-spacing:-.2px;box-shadow:0 7px 20px rgba(8,45,66,.2),inset 0 1px 0 #fff}
#co{color:#0d5c65}
#lv{color:#183e5a}
#goal{top:calc(env(safe-area-inset-top,0px) + 59px);left:10px;right:10px;height:27px;border:1px solid rgba(255,255,255,.75);background:rgba(240,252,255,.78);box-shadow:0 4px 12px #174e6620;backdrop-filter:blur(10px);border-radius:10px}
#gf{background:linear-gradient(90deg,#ff9f43,#ffd166 70%,#8de3c4);border-radius:10px}
#gt{font-size:11px;line-height:25px;letter-spacing:.1px}
#ts{top:calc(env(safe-area-inset-top,0px) + 96px);left:50%;right:auto;transform:translateX(-50%);width:max-content;max-width:calc(100% - 28px);border-radius:13px;padding:10px 15px;background:rgba(13,48,68,.94);color:#f6fdff;border:1px solid rgba(255,255,255,.25);box-shadow:0 9px 28px #082e4055;font-size:13px;backdrop-filter:blur(14px)}
#bar{left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 9px);gap:6px;padding:7px;background:rgba(8,42,62,.18);border:1px solid rgba(255,255,255,.35);border-radius:21px;backdrop-filter:blur(14px);filter:drop-shadow(0 8px 18px #07334b28)}
#bar button{min-height:62px;border:1px solid rgba(21,67,91,.12);border-radius:14px;padding:8px 2px 7px;background:linear-gradient(160deg,#ffffff,#eaf6f8);color:#153950;font-size:10px;font-weight:800;line-height:1.2;box-shadow:0 4px 0 rgba(11,57,78,.12),inset 0 1px 0 #fff;transition:transform .12s,box-shadow .12s}
#bar button b{font-size:21px;margin-bottom:3px;filter:drop-shadow(0 2px 0 #d9e9ed)}
#bar button.on{background:linear-gradient(160deg,#ffe8a3,#ffc85b);color:#49381b;border-color:#fff1bd;box-shadow:0 4px 0 #d79a38,inset 0 1px 0 #fff6d8}
#bar button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(11,57,78,.12)}
#bar button:disabled{opacity:.48;filter:grayscale(.25)}
#ov{inset:0;background:linear-gradient(180deg,rgba(4,35,53,.25),rgba(4,35,53,.64));backdrop-filter:blur(3px)}
#pn{max-width:350px;width:100%;padding:25px 22px 23px;border-radius:25px;background:linear-gradient(155deg,rgba(255,255,255,.98),rgba(228,247,250,.96));border:1px solid rgba(255,255,255,.95);box-shadow:0 22px 65px rgba(0,29,48,.35),inset 0 1px 0 #fff;position:relative;overflow:hidden}
#pn:before{content:"⚓";display:grid;place-items:center;margin:0 auto 13px;width:60px;height:60px;border-radius:19px;background:linear-gradient(145deg,#0f7286,#0c405c);color:#fff;font-size:29px;box-shadow:0 7px 15px #0b526333}
#oh{font-size:29px;letter-spacing:-1.1px;margin:0 0 8px;color:#12344b}
#op{font-size:13px;line-height:1.6;color:#4b6678;margin:0 0 19px}
#ob{width:100%;border-radius:14px;background:linear-gradient(135deg,#ff8066,#f45e4b);color:#fff;font-size:16px;padding:13px 24px;box-shadow:0 5px 0 #c9473b,0 9px 18px #ee725044}
#ob:active{transform:translateY(2px);box-shadow:0 3px 0 #c9473b}
.coin{border:2px solid rgba(255,255,255,.85);background:linear-gradient(145deg,#ffe88a,#ffbd36);color:#62420c;font-size:13px;padding:7px 10px;box-shadow:0 4px 0 #c98d20,0 7px 16px #102f3c33;animation:coinFloat 1.6s ease-in-out infinite}
.coin.fire{background:linear-gradient(145deg,#ff7866,#ed3e34);color:#fff;box-shadow:0 4px 0 #a62b28,0 7px 16px #102f3c33}
@keyframes coinFloat{0%,100%{margin-top:0}50%{margin-top:-4px}}
button{ -webkit-tap-highlight-color:transparent;cursor:pointer}
#bar button:focus-visible,#ob:focus-visible,.coin:focus-visible{outline:3px solid #0f8496;outline-offset:2px}
@media(max-width:390px){#hud{gap:5px}.pill{padding:8px 10px;font-size:12px}#bar{gap:4px;padding:5px}#bar button{font-size:9px;min-height:58px;border-radius:12px}#bar button b{font-size:19px}}
@media(min-width:700px){#hud{left:18px;right:18px;max-width:720px}#goal{left:18px;right:auto;width:500px}#bar{left:50%;right:auto;transform:translateX(-50%);width:min(720px,calc(100% - 28px));gap:8px}#bar button{font-size:12px;min-height:70px}#bar button b{font-size:24px}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><span class="pill" id="co"></span><span class="pill" id="lv" style="margin-left:auto"></span></div>
<div id="goal"><i id="gf"></i><span id="gt"></span></div>
<div id="ts" hidden></div>
<div id="ov"><div id="pn"><h1 id="oh">Puerto Faro</h1><p id="op">Diseña tu propia marina, recibe embarcaciones y crea un destino costero de primera. Construye muelles, abre negocios, cobra monedas y controla las emergencias para hacer crecer tu puerto.</p><button id="ob">Jugar</button></div></div>
<div id="bar"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=i=>document.getElementById(i),T=THREE;
const renderer=new T.WebGLRenderer({canvas:$('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new T.Scene();scene.background=new T.Color(0x8fdcea);
const cam=new T.PerspectiveCamera(45,1,.1,300);
let H=22,HT=22;
function setCam(){const a=innerWidth/innerHeight,d=Math.max(15/a,H)/(2*Math.tan(22.5*Math.PI/180));
 cam.position.set(-3.4,d*Math.cos(.35),.3+d*Math.sin(.35));cam.lookAt(-3.4,0,.3)}
function resize(){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();setCam()}
addEventListener('resize',resize);resize();
scene.add(new T.HemisphereLight(0xffffff,0x4aa3b5,.9));
const sun=new T.DirectionalLight(0xffffff,.6);sun.position.set(6,10,4);scene.add(sun);
const M=c=>new T.MeshStandardMaterial({color:c,flatShading:true,roughness:.9,metalness:0});
const box=(w,h,d,c,x,y,z,p)=>{const m=new T.Mesh(new T.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);(p||scene).add(m);return m};
box(90,.2,90,0x2fa8c6,0,-.1,0);box(7,.04,40,0x63d3e3,-1,.01,0);box(7.2,.6,34,0xf1d9a0,-7.2,.3,0);box(.35,.1,34,0xffffff,-3.5,.04,0);

// datos
const COL=[-9.6,-7.2,-4.8,-2.4],zr=r=>(r-5.5)*2.4,PAL=[0xff6f59,0xffc83d,0x7b61ff,0x3ddc97,0xffffff];
const TK=['dock','cafe','shop','hotel','dive'],EX=[150,300,500],HS=[22,27,32,37];
const TY={dock:{n:'Muelle',c:30,e:'⚓'},cafe:{n:'Café',c:50,e:'🍔',s:8,col:0xff6f59,w:3},shop:{n:'Tienda',c:40,e:'🎁',s:10,col:0xffc83d,w:3},hotel:{n:'Hotel',c:120,e:'🏨',s:25,col:0x7b61ff,w:7},dive:{n:'Buceo',c:90,e:'🤿',s:20,col:0x3b9dff,w:4}};
let money=100,lvl=1,earned=0,goal=100,ex=0,tool=null,playing=false,spawnT=1,fireT=45,time=0,uiT=0;
let boats=[],guests=[],coins=[];const blds=[],cells=[],plates=[];
const goalFor=l=>Math.round(100+120*(l-1)+30*(l-1)**2);

// casillas
for(let r=0;r<12;r++){cells[r]=[null,null,null,null];plates[r]=[];
 for(let c=0;c<4;c++){const m=new T.Mesh(new T.BoxGeometry(2.1,.04,2.1),new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.25}));
  m.position.set(COL[c],c<3?.62:.06,zr(r));scene.add(m);plates[r][c]=m}}
function refresh(){for(let r=0;r<12;r++)for(let c=0;c<4;c++){const m=plates[r][c];
 m.visible=r>=3-ex&&r<=8+ex&&!cells[r][c];m.material.opacity=!tool?.25:((tool==='dock')===(c===3)?.7:.1)}}
function build(t,r,c,free){const d=TY[t];if(!t||cells[r][c]||(t==='dock')!==(c===3)||(!free&&money<d.c))return;
 if(!free)money-=d.c;
 const g=new T.Group();g.position.set(COL[c],c<3?.6:0,zr(r));scene.add(g);
 if(t==='dock'){box(2.2,.25,1.9,0xb98250,0,.12,0,g);[[.9,.8],[.9,-.8],[-.9,.8],[-.9,-.8]].forEach(p=>box(.18,.6,.18,0x6b4a2b,p[0],.3,p[1],g))}
 else{const h=t==='hotel'?2.2:1.1;box(1.8,h,1.8,0xfff4dc,0,h/2,0,g);
  for(let f=0;f<(t==='hotel'?2:1);f++)[-.45,.45].forEach(z=>box(.06,.35,.4,0x2a4a63,.91,.55+f*1.0,z,g));box(.06,.55,.35,d.col,.91,.28,0,g);box(.5,.08,1.5,d.col,1.05,.95,0,g);
  const rf=new T.Mesh(new T.ConeGeometry(1.5,.9,4),M(d.col));rf.rotation.y=Math.PI/4;rf.position.y=h+.45;g.add(rf)}
 const k={t,g,r,c,fire:false};cells[r][c]=k;if(t!=='dock')blds.push(k);refresh()}

// barcos y turistas
function mkBoat(ty){const g=new T.Group(),c=PAL[Math.random()*5|0],s=[1,1.15,1.35][ty];
 box(2.4*s,.5,s,c,0,.2,0,g);
 const bow=new T.Mesh(new T.ConeGeometry(.5*s,.8*s,4),M(c));bow.rotation.z=Math.PI/2;bow.scale.set(.5,1,1);bow.position.set(-1.6*s,.2,0);g.add(bow);
 box(.9*s,.55,.7*s,0xffffff,.3*s,.7,0,g);if(ty>1)box(.6,.4,.5,0xffc83d,-.6,.65,0,g);return g}
function hullG(s,h){const sh=new T.Shape();sh.moveTo(1.2*s,.5*s);sh.lineTo(-.7*s,.5*s);sh.lineTo(-1.9*s,0);sh.lineTo(-.7*s,-.5*s);sh.lineTo(1.2*s,-.5*s);sh.closePath();
 const g=new T.ExtrudeGeometry(sh,{depth:h,bevelEnabled:false});g.rotateX(-Math.PI/2);return g}
function mkBoat2(ty){const g=new T.Group(),c=PAL[Math.random()*5|0],s=[.9,1.1,1.4][ty],bx=(w,h,d,col,x,y,z)=>box(w,h,d,col,x,y,z,g),W=0x2a4a63;
 const part=(geo,col,y)=>{const m=new T.Mesh(geo,M(col));m.position.y=y;g.add(m)};
 part(hullG(s,.5),c,0);part(hullG(s*1.03,.07),0xffffff,.28);part(hullG(s*.9,.05),0xe8d5b0,.5);
 if(ty===0){const m=new T.Mesh(new T.CylinderGeometry(.05,.06,2.6,6),M(0x8a6a44));m.position.set(-.2,1.85,0);g.add(m);
  const sh=new T.Shape();sh.moveTo(0,0);sh.lineTo(0,2.3);sh.lineTo(1.5,.1);sh.closePath();const sg=new T.ExtrudeGeometry(sh,{depth:.04,bevelEnabled:false});sg.translate(0,0,-.02);
  const sl=new T.Mesh(sg,M(0xffffff));sl.position.set(-.15,.7,0);g.add(sl);bx(.6,.25,.45,0xffffff,.7,.7,0)}
 else if(ty===1){bx(1.1,.6,.8,0xffffff,.2,.85,0);bx(1.12,.16,.82,W,.2,.92,0);bx(1.25,.06,.95,c,.2,1.18,0);bx(.22,.5,.22,0xff6f59,.6,1.45,0)}
 else{bx(2,.55,.9,0xffffff,.1,.82,0);bx(2.02,.15,.92,W,.1,.86,0);bx(1.2,.5,.7,0xffffff,.4,1.35,0);bx(1.22,.14,.72,W,.4,1.4,0);bx(1.35,.06,.85,c,.4,1.63,0);bx(.05,.5,.05,0x9aa7b3,.5,1.9,0);bx(.5,.05,.05,0x9aa7b3,.5,2.1,0)}
 return g}
function mkGuest(){const g=new T.Group();box(.3,.5,.3,PAL[Math.random()*5|0],0,.25,0,g);
 const h=new T.Mesh(new T.SphereGeometry(.17,6,5),M(0xffd9b3));h.position.y=.65;g.add(h);return g}
function spawn(){const f=[];for(let r=3-ex;r<=8+ex;r++){const k=cells[r][3];if(k&&!k.boat)f.push(k)}
 if(!f.length)return;const k=f[Math.random()*f.length|0],ty=Math.random()<.6?0:(Math.random()<.75||lvl<2?1:2),g=mkBoat2(ty);
 const b={g,k,state:'in',fee:[10,16,28][ty],n:[2,3,4][ty],stay:6+Math.random()*2,out:0,ph:Math.random()*6,tx:-.9};
 k.boat=b;g.position.set(6,0,zr(k.r));scene.add(g);boats.push(b)}
function arrive(b){coin(b.g,b.fee,'🪙',9);
 for(let i=0;i<b.n&&blds.length;i++){const m=mkGuest();m.position.set(-2.4,.25,zr(b.k.r));scene.add(m);
  guests.push({m,b,t:blds[Math.random()*blds.length|0],st:0,w:0,o:(Math.random()-.5)*.8});b.out++}}

// monedas y fuegos
function coin(g,v,e,t,fire,cell){const el=document.createElement('button');el.className='coin'+(fire?' fire':'');el.textContent=e+(v?' +'+v:'');
 document.body.appendChild(el);const o={el,g,v,t,fire,cell};el.onpointerdown=ev=>{ev.stopPropagation();take(o,true)};coins.push(o)}
function take(o,ok){const i=coins.indexOf(o);if(i<0)return;coins.splice(i,1);o.el.remove();
 if(o.fire){o.cell.fire=false;if(ok)money+=5;else{money=Math.max(0,money-20);toast('El fuego causó daños: -20 🪙')}}
 else if(ok){money+=o.v;earned+=o.v}}
function toast(t){const e=$('ts');e.textContent=t;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>e.hidden=true,3000)}

function step(dt){if(!playing)return;
 spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(2.5,6-lvl*.4)*(1-.1*ex)*(.8+Math.random()*.5)}
 fireT-=dt;if(fireT<=0&&blds.length>1){const k=blds[Math.random()*blds.length|0];if(!k.fire){k.fire=true;coin(k.g,0,'🔥',10,true,k)}fireT=35+Math.random()*25}
 for(const b of boats){const p=b.g.position,dx=b.tx-p.x,d=Math.abs(dx);
  if(d>.05)p.x+=Math.sign(dx)*Math.min(d,(b.state==='out'?4:3)*dt);
  else if(b.state==='in'){b.state='docked';arrive(b)}else if(b.state==='out')b.state='gone';
  p.y=Math.sin(time*2+b.ph)*.05;
  if(b.state==='docked'){b.stay-=dt;if(b.stay<=0&&b.out<=0){b.state='out';b.k.boat=null;b.tx=7;b.g.rotation.y=Math.PI}}}
 boats=boats.filter(b=>{if(b.state==='gone'){scene.remove(b.g);return false}return true});
 for(const q of guests){const p=q.m.position,z0=zr(q.b.k.r),t=q.t,D=TY[t.t];
  const W=[[-3.9,z0],[COL[t.c]+q.o,zr(t.r)+q.o],0,[-3.9,z0],[-1.6,z0]];
  if(q.st===2){q.w+=dt;if(q.w>=D.w){coin(t.g,D.s,D.e,9);q.st=3}}
  else if(q.st<5){const w=W[q.st],dx=w[0]-p.x,dz=w[1]-p.z,d=Math.hypot(dx,dz);
   if(d<.1)q.st++;else{p.x+=dx/d*2.2*dt;p.z+=dz/d*2.2*dt}}
  p.y=p.x<-3.6?.6:.25;
  if(q.st>=5){scene.remove(q.m);q.b.out--;q.done=1}}
 guests=guests.filter(q=>!q.done);
 for(const o of coins.slice()){o.t-=dt;if(o.t<=0)take(o,false)}
 while(earned>=goal){earned-=goal;const bn=50*lvl;money+=bn;toast('¡Objetivo '+lvl+' cumplido! +'+bn+' 🪙');lvl++;goal=goalFor(lvl)}}

// interfaz
const btns=TK.map(k=>{const b=document.createElement('button');b.onclick=()=>{tool=tool===k?null:k;refresh();ui()};$('bar').appendChild(b);return b});
const be=document.createElement('button');$('bar').appendChild(be);
be.onclick=()=>{const c=EX[ex];if(ex<3&&money>=c){money-=c;ex++;HT=HS[ex];refresh();toast('¡Puerto ampliado! Hay terreno y muelles nuevos');ui()}};
function ui(){TK.forEach((k,i)=>{const b=btns[i],d=TY[k];b.innerHTML='<b>'+d.e+'</b>'+d.n+' '+d.c;b.disabled=money<d.c;b.classList.toggle('on',tool===k)});
 be.innerHTML=ex>=3?'<b>🏝</b>Máx':'<b>🏝</b>Ampliar '+EX[ex];be.disabled=ex>=3||money<EX[ex]}
function hud(){$('co').textContent='🪙 '+money;$('lv').textContent='Nivel '+lvl;
 $('gf').style.width=Math.min(100,earned/goal*100)+'%';$('gt').textContent='Objetivo: '+earned+' / '+goal}
const ray=new T.Raycaster(),mv=new T.Vector2(),pl=new T.Plane(new T.Vector3(0,1,0),-.3),pt=new T.Vector3(),v=new T.Vector3();
$('c').addEventListener('pointerdown',e=>{if(!playing||!tool)return;
 mv.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mv,cam);
 if(!ray.ray.intersectPlane(pl,pt))return;const x=pt.x,r=Math.round(pt.z/2.4+5.5);
