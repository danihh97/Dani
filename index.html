<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07354a"><title>Marina Tycoon Realista</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#06384d;color:white;font-family:system-ui,-apple-system,sans-serif}#app{height:100dvh;position:relative}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;top:env(safe-area-inset-top,6px);left:7px;right:7px;display:flex;gap:5px;z-index:3}.brand,.stat,.mission,.bottom,.side button{background:#052f45eF;border:1px solid #50c0c9;border-radius:12px;box-shadow:0 3px 0 #032433}.brand{padding:7px;min-width:115px}.brand b{display:block;font-size:12px}.brand small{font-size:9px;color:#9be5df}.stats{display:flex;flex:1;gap:4px}.stat{flex:1;min-width:0;text-align:center;padding:5px 3px}.stat small{font-size:8px;color:#b6e4e3;display:block}.stat b{font-size:11px;white-space:nowrap}.mission{position:absolute;top:65px;right:8px;width:48%;padding:9px;font-size:10px;z-index:3}.mission b{display:block;color:#ffda7c;margin-bottom:4px}.progress{height:4px;background:#164d5f;border-radius:4px;margin-top:6px}.progress span{height:100%;display:block;background:#55df9a;width:0}.side{position:absolute;top:75px;left:7px;display:flex;flex-direction:column;gap:5px;z-index:3}.side button{color:white;width:57px;min-height:43px;font-weight:800;font-size:9px;padding:4px}.side span{display:block;font-size:20px}.bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 7px);left:7px;right:7px;padding:7px;z-index:4}.boats{display:flex;overflow-x:auto;gap:5px;padding-bottom:7px;scrollbar-width:none}.boat{flex:0 0 77px;border-radius:10px;border:1px solid #398596;background:#0a485d;color:white;padding:5px 2px;text-align:center}.boat.active{background:linear-gradient(#ffe6a5,#ffbd51);color:#392d18}.boat span{display:block;font-size:23px}.boat b{display:block;font-size:10px}.boat small{font-size:9px}.controls{display:flex;gap:5px;align-items:center}.controls button,.action{border:1px solid #4abac4;background:#0b5269;color:white;border-radius:9px;padding:9px 8px;font-size:10px;font-weight:800}.gold{background:linear-gradient(#ffe5a0,#ffbd4a)!important;color:#40311a!important}.hint{font-size:9px;color:#c2e7e5;flex:1}.toast{display:none;position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);z-index:10;background:#fff4dc;color:#163a47;border:2px solid #e5b74e;border-radius:12px;padding:11px;font-weight:800;font-size:12px;text-align:center;max-width:85%}.modal{display:none;position:absolute;inset:0;background:#001b2dcc;z-index:12;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.panel{width:min(420px,100%);max-height:85dvh;overflow:auto;background:linear-gradient(145deg,#0d566b,#062d43);border:2px solid #65d4d2;border-radius:18px;padding:16px}.panel h2{font-size:20px;margin:0 0 7px}.panel p{font-size:12px;color:#d0eded;line-height:1.4}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.opt{background:#0b465b;color:white;border:1px solid #54b8c3;border-radius:11px;padding:10px 4px;font:inherit}.opt span{display:block;font-size:22px}.opt b{font-size:11px}.opt small{display:block;color:#bde7e5;font-size:9px}.close{margin-top:12px;padding:10px;border:1px solid #5dc9cf;border-radius:9px;background:#0c5369;color:white;font-weight:800}
@media(max-height:650px){.side{top:60px}.side button{min-height:36px}.bottom{padding:5px}.boat{flex-basis:68px}.boat span{font-size:20px}.brand{padding:5px}.mission{top:57px}}
</style></head><body><div id="app"><canvas id="c"></canvas><div class="hud"><div class="brand"><b>⚓ MARINA TYCOON</b><small>PUERTO REALISTA</small></div><div class="stats"><div class="stat"><small>TESORO</small><b id="cash">€ 8.000</b></div><div class="stat"><small>VISITAS</small><b id="visits">0</b></div><div class="stat"><small>AMARRES</small><b id="berths">0</b></div><div class="stat"><small>NIVEL</small><b id="level">1</b></div></div></div><div class="mission"><b>📋 OBJETIVO DEL DÍA</b><span id="goal">Construye 3 amarres y recibe 3 barcos.</span><div class="progress"><span id="prog"></span></div></div><div class="side"><button id="build"><span>🏗️</span>Construir</button><button id="services"><span>⛽</span>Servicios</button><button id="fleet"><span>🛥️</span>Flota</button><button id="staff"><span>👷</span>Personal</button><button id="missions"><span>📋</span>Misiones</button></div><div class="bottom"><div class="boats" id="boats"></div><div class="controls"><div class="hint" id="hint">Toca Construir y después el agua para ampliar el puerto.</div><button id="minus">−</button><button id="plus">+</button><button id="save">💾</button><button class="gold" id="construct">🏗️ Construir</button></div></div><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="panel"><h2 id="title"></h2><p id="desc"></p><div class="grid" id="grid"></div><button class="close" id="close">Volver al puerto</button></div></div></div>
<script>
(()=>{const cv=document.querySelector('#c'),ctx=cv.getContext('2d');let W,H,D=1,zoom=1,px=0,py=0,cash=8000,visits=0,level=1,served=0,id=1,mode='',buildings=[],boats=[],drag=null,timer;
const vessels=[['⛵','Velero',350,.72,'sail'],['🚤','Lancha',450,.6,'launch'],['🛥️','Yate pequeño',600,.8,'yacht'],['🛥️','Yate mediano',850,1,'yacht'],['🛥️','Yate de lujo',1200,1.2,'luxury'],['⛵','Catamarán',950,1,'cat'],['🎣','Pesquero',700,.95,'fish'],['🚢','Barco turístico',1000,1.15,'tour'],['🛳️','Crucero',3000,1.5,'cruise'],['🛥️','Superyate',5000,1.65,'luxury']];
const builds=[['dock','🪵','Amarre',180],['pier','⚓','Muelle largo',350],['fuel','⛽','Gasolinera náutica',650],['workshop','🔧','Taller náutico',800],['restaurant','🍽️','Restaurante',950],['hotel','🏨','Hotel',1600],['shop','🛍️','Tienda náutica',550],['dive','🤿','Escuela de buceo',700],['tree','🌴','Palmeras y jardín',120]];
function resize(){let r=cv.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,2);cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function iso(x,y,z=0){return{x:W*.52+(x-y)*34*zoom+px,y:H*.47+(x+y)*17*zoom+py-z}}
function poly(p,fill,stroke){ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);p.slice(1).forEach(q=>ctx.lineTo(q.x,q.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function line(a,b,col,w=1){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke()}
function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h)}
function sea(){let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#35b8c3');g.addColorStop(.5,'#087c96');g.addColorStop(1,'#06435f');rect(0,0,W,H,g);for(let i=0;i<80;i++){let x=(i*91+19)%W,y=(i*53+12)%H;ctx.strokeStyle=i%3?'#b1e8df55':'#d0f4e966';ctx.beginPath();ctx.ellipse(x,y,4+i%6*2,1.3,0,0,Math.PI*2);ctx.stroke()}}
function land(){poly([{x:0,y:0},{x:W,y:0},{x:W,y:H*.13},{x:W*.77,y:H*.17},{x:W*.6,y:H*.12},{x:W*.43,y:H*.19},{x:W*.19,y:H*.15},{x:0,y:H*.2}],'#63b970');poly([{x:0,y:0},{x:W,y:0},{x:W,y:24},{x:W*.7,y:32},{x:W*.45,y:18},{x:W*.2,y:36},{x:0,y:28}],'#a4d77e');for(let i=0;i<17;i++){let x=(i*77+20)%W,y=25+(i*17)%(H*.13);ctx.fillStyle='#755336';rect(x-2,y,4,10);ctx.fillStyle='#188258';ctx.beginPath();ctx.arc(x,y-4,8,0,7);ctx.fill();ctx.fillStyle='#44aa69';ctx.beginPath();ctx.arc(x-3,y-7,5,0,7);ctx.fill()}}
function drawDock(b){let a=iso(b.x,b.y),q=iso(b.x+1,b.y),c=iso(b.x+1,b.y+.23),d=iso(b.x,b.y+.23);poly([{x:a.x,y:a.y-4},{x:q.x,y:q.y-4},{x:c.x,y:c.y-4},{x:d.x,y:d.y-4}],'#9b744b','#edc68a');for(let i=0;i<5;i++){let t=i/4;line({x:a.x+(q.x-a.x)*t,y:a.y+(q.y-a.y)*t-4},{x:d.x+(c.x-d.x)*t,y:d.y+(c.y-d.y)*t-4},'#d7b17a')}for(let p of [a,q]){ctx.fillStyle='#49372b';ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,7);ctx.fill()}}
function drawBuilding(b){let p=iso(b.x,b.y),s=zoom,w=25*s,h=12*s;poly([{x:p.x-w,y:p.y-h},{x:p.x,y:p.y-h-15*s},{x:p.x+w,y:p.y-h},{x:p.x,y:p.y+h}],'#e7c999','#fff0cb');poly([{x:p.x-w,y:p.y-h},{x:p.x,y:p.y+h},{x:p.x,y:p.y+h+10*s},{x:p.x-w,y:p.y+3*s}],'#fff0d1','#b48d60');poly([{x:p.x,y:p.y+h},{x:p.x+w,y:p.y-h},{x:p.x+w,y:p.y+3*s},{x:p.x,y:p.y+h+10*s}],'#dfa96e','#b48d60');let roof=b.type==='hotel'?'#bc5148':b.type==='restaurant'?'#e5a24f':b.type==='workshop'?'#5e8390':'#4d9fc0';poly([{x:p.x-w-3*s,y:p.y-h},{x:p.x,y:p.y-h-19*s},{x:p.x+w+3*s,y:p.y-h},{x:p.x,y:p.y-h+3*s}],roof,'#f0d3a1');ctx.font=`${Math.max(10,13*s)}px system-ui`;ctx.textAlign='center';ctx.fillText(b.emoji,p.x,p.y+3*s)}
function drawBoat(b){let p=iso(b.x,b.y,7),s=b.size*zoom;ctx.save();ctx.translate(p.x,p.y+Math.sin(Date.now()/700+b.id)*1.4);ctx.rotate(b.angle||0);ctx.scale(s,s);poly([{x:-24,y:-3},{x:22,y:-3},{x:14,y:8},{x:-16,y:8}],'#253f4c','#d7ece6');poly([{x:-20,y:-3},{x:17,y:-3},{x:11,y:3},{x:-14,y:3}],b.color||'#f7f2e5','#fff8e4');if(['sail','cat'].includes(b.kind)){line({x:-1,y:-2},{x:-1,y:-25},'#594c3e',1.5);poly([{x:-2,y:-23},{x:-2,y:-5},{x:-14,y:-6}],'#fff9e9','#a8c8c6');poly([{x:0,y:-20},{x:0,y:-7},{x:10,y:-7}],'#efd68b','#a8c8c6')}else{ctx.fillStyle=b.kind==='cruise'?'#e8e6d9':'#f7f0dc';ctx.fillRect(-13,-12,25,9);for(let i=0;i<4;i++){ctx.fillStyle='#67c4d0';ctx.fillRect(-10+i*6,-9,3,2)}if(b.kind==='luxury'){ctx.fillStyle='#fff8e6';ctx.fillRect(-3,-17,14,6)}}ctx.restore()}
function render(){sea();land();for(let x=-1;x<9;x++)for(let y=-1;y<9;y++){let a=iso(x,y),b=iso(x+1,y),c=iso(x+1,y+1),d=iso(x,y+1);poly([a,b,c,d],(x+y)%2?'#1594a04c':'#0b87994c','#a5e5df55')}for(let b of buildings.filter(b=>['dock','pier'].includes(b.type)))drawDock(b);for(let b of buildings.filter(b=>!['dock','pier'].includes(b.type)))drawBuilding(b);boats.forEach(drawBoat);let l=iso(6.4,6.1);poly([{x:l.x-6,y:l.y},{x:l.x+6,y:l.y},{x:l.x+4,y:l.y-26},{x:l.x-4,y:l.y-26}],'#f6eee0','#a8c5c5');rect(l.x-5,l.y-29,10,5,'#d94d48');rect(l.x-3,l.y-35,6,6,'#fff1d2');ctx.beginPath();ctx.arc(l.x,l.y-35,2,0,7);ctx.fillStyle='#ffe99b';ctx.fill();requestAnimationFrame(render)}
function fmt(n){return '€ '+Math.round(n).toLocaleString('es-ES')}function update(){document.querySelector('#cash').textContent=fmt(cash);document.querySelector('#visits').textContent=visits;document.querySelector('#berths').textContent=buildings.filter(b=>['dock','pier'].includes(b.type)).length;document.querySelector('#level').textContent=level;let d=Math.min(100,Math.min(served,3)/3*65+Math.min(buildings.filter(b=>b.type==='dock').length,3)/3*35);document.querySelector('#prog').style.width=d+'%';document.querySelector('#goal').textContent=`Construye ${Math.max(0,3-buildings.filter(b=>b.type==='dock').length)} amarres y recibe ${Math.max(0,3-served)} barcos.`}
function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.style.display='block';clearTimeout(timer);timer=setTimeout(()=>t.style.display='none',2200)}
function panel(title,desc,items){document.querySelector('#title').textContent=title;document.querySelector('#desc').textContent=desc;let g=document.querySelector('#grid');g.innerHTML='';items.forEach(it=>{let b=document.createElement('button');b.className='opt';b.innerHTML=`<span>${it.e}</span><b>${it.n}</b><small>${it.i}</small>`;b.onclick=it.f;g.appendChild(b)});document.querySelector('#modal').classList.add('show')}
document.querySelector('#close').onclick=()=>document.querySelector('#modal').classList.remove('show');
function buildPanel(){panel('🏗️ Construir','Elige una instalación y después toca un espacio libre del puerto.',builds.map(t=>({e:t[1],n:t[2],i:fmt(t[3]),f:()=>{if(cash<t[3])return toast('No tienes suficiente dinero.');mode=t[0];document.querySelector('#modal').classList.remove('show');document.querySelector('#hint').textContent='Toca una zona libre del agua para colocar '+t[2]+'.';toast('Seleccionado: '+t[2])}})))}
function fleetPanel(){panel('🛥️ Comprar barcos','Compra barcos de distintos tamaños y tipos para dar vida a tu marina.',vessels.map((v,i)=>({e:v[0],n:v[1],i:fmt(v[2])+(i>7?' · nivel '+(i===8?5:8):''),f:()=>{if(i>7&&level<(i===8?5:8))return toast('Sube de nivel para desbloquearlo.');if(cash<v[2])return toast('No tienes suficiente dinero.');cash-=v[2];boats.push({id:id++,x:1+Math.random()*4,y:2+Math.random()*4,size:v[3],kind:v[4],color:['#f7f2e5','#e7eee7','#e9d7b5','#f8f6ef'][Math.floor(Math.random()*4)],angle:(Math.random()-.5)*.2});visits+=2;update();toast(v[1]+' añadido a tu flota.');document.querySelector('#modal').classList.remove('show')}})))}
function servicesPanel(){let sv=[['⛽','Repostaje',40,130],['🔧','Reparación',60,190],['🛥️','Paseo turístico',0,150],['🎣','Pesca deportiva',0,120],['🤿','Buceo',0,180],['🛟','Equipo de rescate',70,-1]];panel('🧰 Servicios','Ofrece actividades para ganar dinero y mejorar tu reputación.',sv.map(v=>({e:v[0],n:v[1],i:v[2]?'Coste '+fmt(v[2])+' · ingreso '+fmt(v[3]):'Ingreso '+fmt(v[3]),f:()=>{if(cash<v[2])return toast('No tienes suficiente dinero.');cash-=v[2];if(v[3]>0)cash+=v[3];else level=Math.min(20,level+1);visits+=3;update();toast(v[1]+' completado.');}})))}
document.querySelector('#build').onclick=buildPanel;document.querySelector('#construct').onclick=buildPanel;document.querySelector('#fleet').onclick=fleetPanel;document.querySelector('#services').onclick=servicesPanel;document.querySelector('#staff').onclick=()=>panel('👷 Personal','Contrata trabajadores para que la marina funcione mejor.',[{e:'🧑‍🔧',n:'Mecánico',i:'500 € · sube nivel',f:()=>{if(cash<500)return toast('Necesitas 500 €.');cash-=500;level++;update();toast('Mecánico contratado.')}},{e:'🧑‍✈️',n:'Marinero',i:'350 € · + visitas',f:()=>{if(cash<350)return toast('Necesitas 350 €.');cash-=350;visits+=4;update();toast('Marinero contratado.')}}]);document.querySelector('#missions').onclick=()=>panel('📋 Misiones','Completa objetivos y desbloquea barcos de mayor tamaño.',[{e:'🚤',n:'Recibir barcos',i:`Progreso ${Math.min(served,3)}/3`,f:()=>toast(served>=3?'¡Objetivo completado!':'Construye amarres y espera barcos.')},{e:'🪵',n:'Construir amarres',i:`Progreso ${Math.min(buildings.filter(b=>b.type==='dock').length,3)}/3`,f:()=>toast('Construye tres amarres para completar el objetivo.')}]);
document.querySelector('#plus').onclick=()=>zoom=Math.min(1.7,zoom+.12);document.querySelector('#minus').onclick=()=>zoom=Math.max(.65,zoom-.12);document.querySelector('#save').onclick=()=>{localStorage.setItem('marinaRealista',JSON.stringify({cash,visits,level,served,buildings,boats,id,zoom}));toast('Partida guardada en este dispositivo.')};
function tileAt(x,y){let best=null,dist=1e9;for(let a=-1;a<9;a++)for(let b=-1;b<9;b++){let p=iso(a+.5,b+.5),d=Math.abs(x-p.x)/(34*zoom)+Math.abs(y-p.y)/(17*zoom);if(d<dist){dist=d;best={x:a,y:b}}}return dist<2?best:null}
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,px,py,moved:false};cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>8)drag.moved=true;if(drag.moved){px=drag.px+dx;py=drag.py+dy}});cv.addEventListener('pointerup',e=>{if(!drag)return;let d=drag;drag=null;if(d.moved)return;let r=cv.getBoundingClientRect(),t=tileAt(e.clientX-r.left,e.clientY-r.top);if(!t)return;let existing=buildings.find(b=>b.x===t.x&&b.y===t.y);if(existing){cash+=20;update();toast('Instalación atendida: +20 €.');return}let b=builds.find(x=>x[0]===mode)||builds[0];if(cash<b[3])return toast('No tienes suficiente dinero.');cash-=b[3];buildings.push({id:id++,type:b[0],emoji:b[1],x:t.x,y:t.y});mode='';update();toast(b[2]+' construido.')});
setInterval(()=>{let dock=buildings.find(b=>['dock','pier'].includes(b.type)&&!b.busy);if(!dock)return;dock.busy=true;let v=vessels[Math.floor(Math.random()*7)];let b={id:id++,x:dock.x+.35,y:dock.y+.1,size:v[3],kind:v[4],color:v[5]||'#f7f2e5',angle:0};boats.push(b);setTimeout(()=>{served++;visits+=4;cash+=100+Math.floor(Math.random()*150);level=Math.min(20,1+Math.floor(served/3));update();toast('¡Barco atracado! Ingresos por tasas portuarias.');setTimeout(()=>{boats=boats.filter(x=>x!==b);dock.busy=false},8000)},2000)},12000);
document.querySelector('#boats').innerHTML=vessels.map((v,i)=>`<button class="boat ${i===0?'active':''}" data-i="${i}"><span>${v[0]}</span><b>${v[1]}</b><small>${fmt(v[2])}</small></button>`).join('');document.querySelectorAll('.boat').forEach(b=>b.onclick=()=>{document.querySelectorAll('.boat').forEach(x=>x.classList.toggle('active',x===b));let v=vessels[+b.dataset.i];document.querySelector('#hint').textContent=`${v[1]} seleccionado · usa Flota para comprarlo.`});
try{let s=JSON.parse(localStorage.getItem('marinaRealista'));if(s){cash=s.cash??cash;visits=s.visits??0;level=s.level??1;served=s.served??0;buildings=s.buildings??[];boats=s.boats??[];id=s.id??1;zoom=s.zoom??1}}catch(e){}update();render();if(!buildings.length)setTimeout(()=>panel('¡Bienvenido a tu marina!','Construye amarres, compra barcos diferentes, ofrece servicios y amplía el puerto. Guarda tu partida en el dispositivo.',[{e:'🪵',n:'Construir amarre',i:'180 €',f:()=>{mode='dock';document.querySelector('#modal').classList.remove('show');toast('Toca el agua para colocar el amarre.')}},{e:'🛥️',n:'Ver barcos',i:'10 tipos diferentes',f:()=>{document.querySelector('#modal').classList.remove('show');fleetPanel()}}]),100);
})();</script></body></html>
