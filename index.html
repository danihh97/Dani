<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AhorraFuel 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101714;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#game{position:fixed;inset:0}
#renderCanvas{width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:7px;flex-wrap:wrap;z-index:5;pointer-events:none}
.card{background:#0b1913dd;border:1px solid #5b7569;border-radius:14px;padding:8px 11px;color:#effff7;backdrop-filter:blur(8px);min-width:88px}
.card b{display:block;font-size:15px}.card span{font-size:9px;color:#9fb8ad}
.controls{position:fixed;left:12px;right:12px;bottom:12px;z-index:6;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.group{display:flex;gap:7px;pointer-events:auto;flex-wrap:wrap}.btn{border:1px solid #5a7468;background:#0b1913ee;color:#fff;border-radius:13px;padding:12px 14px;font-weight:850;font-size:12px;min-height:45px}
.btn.green{background:#3fe482;color:#06140b;border-color:#91f6b7}.btn.yellow{background:#ffd15a;color:#151008}
#info{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);z-index:7;background:#0b1913ed;border:1px solid #5b7569;border-radius:13px;padding:10px 14px;color:#effff7;font-size:11px;text-align:center;max-width:44%;pointer-events:none}
#loading{position:fixed;inset:0;background:#101714;z-index:20;display:flex;align-items:center;justify-content:center;color:white;font-weight:900;font-size:18px}
#panel{position:fixed;right:12px;top:120px;width:210px;z-index:8;background:#0b1913ee;border:1px solid #5b7569;border-radius:16px;padding:12px;color:#fff;display:none}
#panel h3{margin:0 0 5px;font-size:14px}#panel p{margin:0 0 10px;font-size:11px;color:#a8bdb3}.bar{height:12px;background:#06100c;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#3fe482}
@media(max-width:600px){.card{min-width:calc(50% - 4px)}#info{max-width:48%;font-size:9px}.controls{bottom:8px}.btn{padding:10px 11px}}
</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
<div id="game"><canvas id="renderCanvas"></canvas></div>
<div id="loading">Cargando AhorraFuel 3D…</div>

<div class="hud">
 <div class="card"><b id="money">12.540 €</b><span>DINERO</span></div>
 <div class="card"><b id="fuel">3.250 L</b><span>DEPÓSITO</span></div>
 <div class="card"><b id="rep">72%</b><span>REPUTACIÓN</span></div>
 <div class="card"><b id="customers">8</b><span>CLIENTES</span></div>
</div>

<div id="panel">
 <h3 id="panelTitle">Surtidor</h3>
 <p id="panelText">Selecciona un cliente.</p>
 <div class="bar"><i id="progress"></i></div>
</div>

<div id="info">Toca un surtidor o un coche para interactuar.</div>

<div class="controls">
 <div class="group">
  <button class="btn" id="priceBtn">Precio 1,549 €/L</button>
  <button class="btn" id="upgradeBtn">Mejorar</button>
 </div>
 <div class="group">
  <button class="btn" id="tankBtn">Comprar 1.000 L</button>
  <button class="btn green" id="refuelBtn">Repostar cliente</button>
  <button class="btn yellow" id="dayBtn">Cerrar jornada</button>
 </div>
</div>

<script>
(function(){
"use strict";
if(!window.BABYLON){document.getElementById("loading").textContent="No se pudo cargar el motor 3D.";return;}

const canvas=document.getElementById("renderCanvas");
const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true},true);
const scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(.54,.70,.66,1);
scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;scene.fogDensity=.008;
scene.fogColor=new BABYLON.Color3(.54,.70,.66);

const camera=new BABYLON.ArcRotateCamera("camera",-Math.PI/3.1,Math.PI/3.0,32,new BABYLON.Vector3(0,0,0),scene);
camera.attachControl(canvas,true);
camera.lowerRadiusLimit=17;camera.upperRadiusLimit=45;
camera.lowerBetaLimit=.55;camera.upperBetaLimit=1.25;
camera.wheelPrecision=60;
camera.panningSensibility=160;

const hemi=new BABYLON.HemisphericLight("hemi",new BABYLON.Vector3(0,1,0),scene);
hemi.intensity=1.5;
const sun=new BABYLON.DirectionalLight("sun",new BABYLON.Vector3(-.5,-1,.4),scene);
sun.position=new BABYLON.Vector3(15,30,-10);sun.intensity=2.2;

function mat(name,color,rough=1){
 const m=new BABYLON.StandardMaterial(name,scene);m.diffuseColor=BABYLON.Color3.FromHexString(color);m.specularColor=new BABYLON.Color3(.08,.08,.08);return m;
}
const M={
 grass:mat("grass","#6f827a"),road:mat("road","#29332f"),white:mat("white","#e9eee9"),
 green:mat("green","#35df79"),dark:mat("dark","#13231c"),glass:mat("glass","#6fb5c2"),
 red:mat("red","#d95454"),blue:mat("blue","#3d82bd"),yellow:mat("yellow","#efc84d"),
 black:mat("black","#121716"),tree:mat("tree","#3f8851"),trunk:mat("trunk","#704c32"),
 shop:mat("shop","#dfe6e1"),metal:mat("metal","#b9c3bd")
};
function box(name,w,h,d,pos,material,parent=null){
 const m=BABYLON.MeshBuilder.CreateBox(name,{width:w,height:h,depth:d},scene);m.position.copyFrom(pos);m.material=material;m.receiveShadows=true;if(parent)m.parent=parent;return m;
}
function cyl(name,r,h,pos,material,parent=null){
 const m=BABYLON.MeshBuilder.CreateCylinder(name,{diameter:r*2,height:h,tessellation:16},scene);m.position.copyFrom(pos);m.material=material;m.receiveShadows=true;if(parent)m.parent=parent;return m;
}

/* terreno */
box("ground",52,.3,42,new BABYLON.Vector3(0,-.15,0),M.grass);
box("road",52,.32,10,new BABYLON.Vector3(0,.02,14),M.road);
box("road2",10,.33,31,new BABYLON.Vector3(-20,.02,0),M.road);

/* tienda */
const shop=box("shop",11,4.5,6.5,new BABYLON.Vector3(-3,2.25,-5),M.shop);
box("roof",11.5,.45,7,new BABYLON.Vector3(-3,4.7,-5),M.dark);
box("roofGreen",11.7,.22,7.2,new BABYLON.Vector3(-3,4.94,-5),M.green);
box("glass",8.6,2.1,.16,new BABYLON.Vector3(-3,2.2,-8.3),M.glass);

/* marquesina */
box("canopy",15.5,.65,8.2,new BABYLON.Vector3(5,5.15,0),M.dark);
box("canopyGreen",15.9,.25,8.6,new BABYLON.Vector3(5,4.8,0),M.green);
[[-1.2,-2.8],[-1.2,2.8],[11.2,-2.8],[11.2,2.8]].forEach((p,i)=>box("column"+i,.48,4.1,.48,new BABYLON.Vector3(p[0],2.75,p[1]),M.white));

/* surtidores */
const pumps=[];
function createPump(id,x,z){
 const g=new BABYLON.TransformNode("pump"+id,scene);g.position.set(x,0,z);
 box("base",1.65,.3,1.15,new BABYLON.Vector3(0,.25,0),M.dark,g);
 const body=box("body",1.05,1.9,.75,new BABYLON.Vector3(0,1.35,0),M.white,g);
 box("top",.8,.12,.78,new BABYLON.Vector3(0,2.3,0),M.green,g);
 box("screen",.55,.16,.03,new BABYLON.Vector3(0,1.72,-.39),M.dark,g);
 body.metadata={pumpId:id,group:g};pumps.push(body);
}
createPump(1,2,-2);createPump(2,6,-2);createPump(3,10,-2);
createPump(4,2,2);createPump(5,6,2);createPump(6,10,2);

/* cargadores EV */
[15,18].forEach(x=>{box("evbase",1.1,.25,1.1,new BABYLON.Vector3(x,.3,4),M.green);box("ev",.35,1.8,.32,new BABYLON.Vector3(x,1.3,4),M.white)});

/* depósitos y camión */
cyl("tank1",2.1,4.5,new BABYLON.Vector3(-10,2.3,-12),M.metal);
cyl("tank2",2.1,4.5,new BABYLON.Vector3(-5,2.3,-12),M.metal);
box("truckBody",2.7,1.6,6,new BABYLON.Vector3(1,1,-13),M.dark);
box("truckTank",2.5,1.7,4.8,new BABYLON.Vector3(1,1.1,-13),M.white);
box("truckStripe",2.55,.18,5,new BABYLON.Vector3(1,2,-13),M.green);

/* árboles */
for(let i=0;i<20;i++){
 let x=-23+Math.random()*46,z=-18+Math.random()*36;
 if(Math.abs(x)<14&&z<7)continue;
 cyl("trunk",.28,2,new BABYLON.Vector3(x,1,z),M.trunk);
 const c=BABYLON.MeshBuilder.CreateSphere("crown",{diameter:2.8,segments:10},scene);c.position.set(x,2.7,z);c.material=M.tree;
}

/* coches */
const cars=[];
function createCar(color,x,z,targetX,targetZ){
 const g=new BABYLON.TransformNode("car",scene);g.position.set(x,.05,z);
 const body=box("carBody",1.9,.58,3.3,new BABYLON.Vector3(0,.62,0),color,g);
 box("carGlass",1.5,.48,1.55,new BABYLON.Vector3(0,1.03,-.1),M.glass,g);
 [[-.78,-1.02],[.78,-1.02],[-.78,1.02],[.78,1.02]].forEach(p=>cyl("wheel",.28,.18,new BABYLON.Vector3(p[0],.31,p[1]),M.black,g));
 cars.push({g:g,start:new BABYLON.Vector3(x,.05,z),target:new BABYLON.Vector3(targetX,.05,targetZ),t:0,speed:.08+Math.random()*.035,active:true});
}
createCar(M.blue,-19,12,6,-2);
createCar(M.red,19,15,10,2);
createCar(M.yellow,-18,16,2,2);
createCar(M.white,21,10,6,-2);

/* estado */
let money=12540,stock=3250,reputation=72,customers=8,price=1.549,market=1.579,selected=0,busy=false;

function euro(n){return Math.round(n).toLocaleString("es-ES")+" €"}
function ui(){
 document.getElementById("money").textContent=euro(money);
 document.getElementById("fuel").textContent=Math.round(stock).toLocaleString("es-ES")+" L";
 document.getElementById("rep").textContent=Math.round(reputation)+"%";
 document.getElementById("customers").textContent=customers;
 document.getElementById("priceBtn").textContent="Precio "+price.toFixed(3).replace(".",",")+" €/L";
}
function info(t){document.getElementById("info").textContent=t}
function log(t){document.getElementById("info").textContent=t}
ui();

/* selección 3D */
scene.onPointerObservable.add(function(pointerInfo){
 if(pointerInfo.type!==BABYLON.PointerEventTypes.POINTERPICK)return;
 const mesh=pointerInfo.pickInfo.pickedMesh;
 if(!mesh)return;
 let p=mesh;
 while(p && (!p.metadata||!p.metadata.pumpId))p=p.parent;
 if(p&&p.metadata&&p.metadata.pumpId){
   selected=p.metadata.pumpId;
   pumps.forEach(q=>q.material.emissiveColor=new BABYLON.Color3(0,0,0));
   p.material.emissiveColor=new BABYLON.Color3(.05,.45,.2);
   document.getElementById("panel").style.display="block";
   document.getElementById("panelTitle").textContent="Surtidor "+selected;
   document.getElementById("panelText").textContent="Cliente esperando para repostar.";
   document.getElementById("selected").textContent="Surtidor "+selected+" seleccionado";
   info("Surtidor "+selected+" seleccionado");
 }
});

/* botones */
document.getElementById("refuel").onclick=function(){
 if(!selected)return info("Toca un surtidor primero.");
 if(busy)return info("Ya estás repostando.");
 if(stock<40)return info("No tienes suficiente combustible.");
 busy=true;
 let n=0;
 const timer=setInterval(()=>{
   n+=2;stock-=2;
   document.getElementById("progress").style.width=(n/40*100)+"%";
   if(n>=40){
     clearInterval(timer);busy=false;
     const sale=40*price;money+=sale;reputation=Math.min(100,reputation+.4);customers++;
     document.getElementById("panelText").textContent="Cliente atendido: +"+euro(sale);
     info("Has repostado 40 L y cobrado "+euro(sale)+".");ui();
     setTimeout(()=>document.getElementById("progress").style.width="0%",700);
   } else ui();
 },90);
};
document.getElementById("attend").onclick=function(){customers++;reputation=Math.min(100,reputation+.2);info("Cliente atendido. Otro coche se acerca.");ui()};
document.getElementById("tankBtn").onclick=function(){if(money<900)return info("No tienes 900 €.");money-=900;stock+=1000;info("Camión cisterna: +1.000 L.");ui()};
document.getElementById("upgradeBtn").onclick=function(){if(money<1800)return info("Necesitas 1.800 €.");money-=1800;info("Ampliación comprada. En la siguiente versión aparecerá físicamente.");ui()};
document.getElementById("dayBtn").onclick=function(){const p=Math.max(0,Math.round((reputation-30)*2*price*.12));money+=p;market=Math.max(1.4,Math.min(1.8,market+(Math.random()-.5)*.05));info("Jornada cerrada: +"+euro(p));ui()};

document.getElementById("priceBtn").onclick=function(){price+=.01;if(price>1.8)price=1.3;info("Precio cambiado a "+price.toFixed(3).replace(".",",")+" €/L");ui()};

/* animación de coches */
engine.runRenderLoop(()=>{
 const dt=engine.getDeltaTime()/1000;
 cars.forEach(car=>{
   if(!car.active)return;
   car.t+=car.speed*dt;
   const t=Math.min(car.t,1);
   car.g.position.x=car.start.x+(car.target.x-car.start.x)*t;
   car.g.position.z=car.start.z+(car.target.z-car.start.z)*t;
   if(t>=1){
     setTimeout(()=>{car.t=0;const old=car.start.clone();car.start=car.target.clone();car.target=old;},1500);
     car.active=false;
     setTimeout(()=>car.active=true,1700);
   }
 });
 scene.render();
});
window.addEventListener("resize",()=>engine.resize());
setTimeout(()=>document.getElementById("loading").style.display="none",700);
})();
</script>
</body>
</html>
