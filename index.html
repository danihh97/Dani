<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AhorraFuel 3D Tycoon</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#07100c;color:#effff6;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{min-height:100vh}.app{width:min(1100px,100%);margin:auto;padding:10px}
.game{position:relative;overflow:hidden;border:1px solid #355547;border-radius:22px;background:#8fb9ad;box-shadow:0 18px 60px #0008}
canvas{display:block;width:100%;height:min(76vh,720px);min-height:500px;touch-action:none}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.stat{background:#0d2119e8;border:1px solid #4a6759;border-radius:12px;padding:7px 10px;backdrop-filter:blur(5px);min-width:100px}
.stat b{display:block;font-size:14px}.stat span{font-size:9px;color:#a7bdb3}
.left,.right{position:absolute;bottom:10px;display:flex;gap:6px;flex-direction:column}.left{left:10px}.right{right:10px}
button{border:1px solid #567064;border-radius:12px;background:#0d2119ec;color:#fff;min-height:44px;padding:9px 12px;font-weight:850;touch-action:manipulation}
button.primary{background:#3fe482;color:#06140b;border-color:#8af5b5}button.yellow{background:#ffd15a;color:#151008}
#msg{position:absolute;bottom:11px;left:50%;transform:translateX(-50%);background:#0d2119ee;border:1px solid #4a6759;border-radius:12px;padding:9px 13px;font-size:10px;max-width:42%;text-align:center;pointer-events:none}
.panel{margin-top:10px;background:#0d2119;border:1px solid #304d40;border-radius:15px;padding:11px}
.row{display:flex;justify-content:space-between;align-items:center}.price{font-size:25px;font-weight:950}input{width:100%;accent-color:#3fe482}.muted{font-size:10px;color:#a7bdb3}
.actions{display:flex;gap:7px;margin-top:8px}.actions button{flex:1}#log{font-size:11px;color:#b8cec3;min-height:40px;line-height:1.5}
@media(max-width:650px){canvas{height:650px;min-height:500px}.stat{min-width:calc(50% - 3px)}#msg{max-width:40%;font-size:9px}}
</style>
</head>
<body>
<div class="app">
<div class="game">
<canvas id="game"></canvas>
<div class="hud">
<div class="stat"><b id="money">12.540 €</b><span>DINERO</span></div>
<div class="stat"><b id="stock">3.250 L</b><span>COMBUSTIBLE</span></div>
<div class="stat"><b id="rep">72%</b><span>REPUTACIÓN</span></div>
<div class="stat"><b id="clients">8</b><span>CLIENTES</span></div>
</div>
<div class="left"><button class="mode" data-m="price">Precio</button><button class="mode" data-m="upgrade">Mejoras</button><button class="mode" data-m="shop">Tienda</button></div>
<div class="right"><button id="attend">Atender cliente</button><button id="refuel" class="primary">Repostar</button><button id="close" class="yellow">Cerrar jornada</button></div>
<div id="msg">Toca un surtidor para seleccionarlo.</div>
</div>
<div class="panel">
<div class="row"><strong>Gasolina 95</strong><strong class="price" id="priceText">1,549 €/L</strong></div>
<input id="price" type="range" min="1.25" max="1.95" step=".001" value="1.549">
<div class="muted">Competencia: <b id="market">1,579 €/L</b> · <span id="selected">Ningún surtidor</span></div>
<div class="actions"><button id="buy">Comprar 1.000 L · 900 €</button><button id="upgrade">Nuevo surtidor · 1.800 €</button></div>
</div>
<div class="panel" id="log">La gasolinera está abierta. Toca un surtidor para empezar.</div>
</div>

<script>
(()=>{
const c=document.getElementById("game"),ctx=c.getContext("2d");
let W=0,H=0,dpr=1,camX=0,camY=0,zoom=1,drag=false,lastX=0,lastY=0;
let money=12540,stock=3250,rep=72,clients=8,day=12,price=1.549,market=1.579;
let selected=0,mode="price",fueling=false,fuelLiters=0;
const cars=[
{x:-.9,y:.28,t:0,color:"#3b83bd",target:1},
{x:.92,y:.42,t:2,color:"#d95252",target:2},
{x:-.7,y:.58,t:4,color:"#f1c94d",target:3},
{x:.8,y:.68,t:6,color:"#eeeeee",target:4}
];
const trees=[];
for(let i=0;i<22;i++) trees.push({x:(Math.random()-.5)*2.2,y:.15+Math.random()*.72,s:.7+Math.random()*.45});

function resize(){const r=c.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
addEventListener("resize",resize);

function iso(x,y,z=0){
 return {x:W/2+(x-y)*W*.30*zoom+camX,y:H*.52+(x+y)*H*.16*zoom-z*H*.12*zoom+camY}
}
function poly(points,fill,stroke=null,lw=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function rect3(x,y,z,w,d,h,top,left,right){
 const a=iso(x,y,z),b=iso(x+w,y,z),cc=iso(x+w,y+d,z),dd=iso(x,y+d,z);
 const a2=iso(x,y,z+h),b2=iso(x+w,y,z+h),c2=iso(x+w,y+d,z+h),d2=iso(x,y+d,z+h);
 poly([a,b,cc,dd],top);poly([dd,cc,c2,d2],right);poly([a,b,b2,a2],left);poly([a2,b2,c2,d2],top);
}
function shadow(x,y,w,d){const p=iso(x,y,.02),q=iso(x+w,y+d,.02);ctx.save();ctx.fillStyle="#17231e55";ctx.beginPath();ctx.ellipse((p.x+q.x)/2,(p.y+q.y)/2,Math.abs(q.x-p.x)*.55+10,Math.abs(q.y-p.y)*.28+6,-.2,0,Math.PI*2);ctx.fill();ctx.restore()}
function text(txt,x,y,size,color="#fff",align="center"){ctx.fillStyle=color;ctx.font=`800 ${size}px system-ui`;ctx.textAlign=align;ctx.fillText(txt,x,y)}

function drawCar(car){
 const p=iso(car.x,car.y,.05),s=42*zoom;
 ctx.save();ctx.translate(p.x,p.y);ctx.rotate(-.15);
 ctx.fillStyle="#18221e66";ctx.beginPath();ctx.ellipse(0,10,s*.75,s*.25,0,0,Math.PI*2);ctx.fill();
 poly([{x:-s*.62,y:0},{x:s*.5,y:0},{x:s*.65,y:-s*.25},{x:-s*.45,y:-s*.25}],car.color,"#17241e",2);
 poly([{x:-s*.35,y:-s*.27},{x:s*.25,y:-s*.27},{x:s*.12,y:-s*.55},{x:-s*.22,y:-s*.55}],"#8fc8ce","#263a35",1);
 ctx.fillStyle="#111";ctx.beginPath();ctx.arc(-s*.38,2,s*.13,0,7);ctx.fill();ctx.beginPath();ctx.arc(s*.38,2,s*.13,0,7);ctx.fill();ctx.restore()
}

function drawTree(t){
 const p=iso(t.x,t.y,.1),s=25*t.s*zoom;
 ctx.fillStyle="#765035";ctx.fillRect(p.x-3,p.y-s*.2,6,s*.65);
 ctx.fillStyle="#3e8750";ctx.beginPath();ctx.arc(p.x,p.y-s*.55,s*.62,0,7);ctx.fill();
 ctx.fillStyle="#58a762";ctx.beginPath();ctx.arc(p.x-s*.18,p.y-s*.72,s*.38,0,7);ctx.fill()
}

function drawPump(id,x,y){
 const p=iso(x,y,.05),s=34*zoom;
 shadow(x,y,.5,.45);
 ctx.save();ctx.translate(p.x,p.y);
 if(selected===id){ctx.strokeStyle="#3fe482";ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(0,2,s*.65,s*.4,0,0,7);ctx.stroke()}
 rect3(x-.24,y-.18,.05,.48,.36,.8,"#e8eee9","#c5cfca","#aebbb5");
 ctx.fillStyle="#15231e";ctx.fillRect(p.x-p.x+s*.0,0,0,0);
 ctx.restore();
}

function draw(){
 ctx.clearRect(0,0,W,H);
 const sky=ctx.createLinearGradient(0,0,0,H*.55);sky.addColorStop(0,"#8fc1b5");sky.addColorStop(1,"#c1d8c9");ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 ctx.fillStyle="#ffe08b";ctx.beginPath();ctx.arc(W*.83,H*.12,28,0,7);ctx.fill();
 // mountains
 poly([{x:0,y:H*.37},{x:W*.13,y:H*.23},{x:W*.26,y:H*.36},{x:W*.4,y:H*.20},{x:W*.56,y:H*.36},{x:W*.72,y:H*.22},{x:W,y:H*.35},{x:W,y:H*.5},{x:0,y:H*.5}],"#73968d");
 // ground
 poly([{x:0,y:H*.48},{x:W*.5,y:H*.29},{x:W,y:H*.48},{x:W,y:H},{x:0,y:H}],"#65756e");
 // road
 poly([{x:W*.08,y:H},{x:W*.36,y:H*.43},{x:W*.63,y:H*.43},{x:W*.92,y:H}],"#303a36");
 ctx.strokeStyle="#d7ddd8aa";ctx.lineWidth=4;ctx.setLineDash([18,15]);ctx.beginPath();ctx.moveTo(W*.2,H);ctx.lineTo(W*.46,H*.47);ctx.moveTo(W*.8,H);ctx.lineTo(W*.54,H*.47);ctx.stroke();ctx.setLineDash([]);
 // trees behind
 trees.filter(t=>t.y<.48).forEach(drawTree);
 // station building
 shadow(-.62,-.25,1.0,.62);
 rect3(-.72,-.35,.05,1.15,.7,.62,"#e8eee9","#bfcac3","#aebbb5");
 rect3(-.78,-.42,.67,1.28,.84,.10,"#17271f","#17271f","#17271f");
 // glass
 const gl=iso(-.7,-.43,.33),gr=iso(.25,-.43,.33),gt=iso(-.7,-.43,.58),gg=iso(.25,-.43,.58);poly([gl,gr,gg,gt],"#72b8c499","#42625a",1);
 text("TIENDA",W*.37,H*.52,12,"#16362a");
 // canopy
 shadow(.05,-.2,1.0,1.05);
 rect3(.0,-.38,.62,1.55,1.2,.09,"#39e67f","#1d8d50","#1d8d50");
 [[.1,-.27],[1.35,-.27],[.1,.68],[1.35,.68]].forEach(v=>rect3(v[0],v[1],.05,.07,.07,.62,"#e8eee9","#c5cfca","#aebbb5"));
 text("AHORRAFUEL",W*.62,H*.43,13,"#063019");
 // pumps
 drawPump(1,.18,-.25);drawPump(2,.62,-.25);drawPump(3,1.05,-.25);drawPump(4,.18,.42);drawPump(5,.62,.42);drawPump(6,1.05,.42);
 // charger
 for(let x of [1.45,1.7]){const p=iso(x,.55,.05);ctx.fillStyle="#39e67f";ctx.fillRect(p.x-7,p.y-7,14,8);ctx.fillStyle="#e8eee9";ctx.fillRect(p.x-3,p.y-30,6,25)}
 // tanker
 rect3(-1.55,.85,.05,.55,.95,.45,"#e8eee9","#bfc8c2","#aab5af");rect3(-1.48,.85,.5,.48,.82,.07,"#39e67f","#1e9e55","#1e9e55");
 // trees front
 trees.filter(t=>t.y>=.48).forEach(drawTree);
 cars.forEach(drawCar);
 // selected customer
 if(selected){const pumpPos=[[.18,-.25],[.62,-.25],[1.05,-.25],[.18,.42],[.62,.42],[1.05,.42]][selected-1];const p=iso(pumpPos[0],pumpPos[1],.65);ctx.fillStyle="#d69b70";ctx.beginPath();ctx.arc(p.x,p.y-17,6,0,7);ctx.fill();ctx.fillStyle="#39708e";ctx.fillRect(p.x-8,p.y-12,16,18);text("CLIENTE",p.x,p.y-27,8,"#102019")}
 requestAnimationFrame(draw)
}

function renderUI(){
 document.getElementById("money").textContent=Math.round(money).toLocaleString("es-ES")+" €";
 document.getElementById("stock").textContent=Math.round(stock).toLocaleString("es-ES")+" L";
 document.getElementById("rep").textContent=Math.round(rep)+"%";
 document.getElementById("clients").textContent=clients;
 document.getElementById("priceText").textContent=price.toFixed(3).replace(".",",")+" €/L";
 document.getElementById("market").textContent=market.toFixed(3).replace(".",",")+" €/L";
}
function log(t){document.getElementById("log").innerHTML="<div>"+t+"</div>"+document.getElementById("log").innerHTML}
function msg(t){document.getElementById("msg").textContent=t}

function hitPump(px,py){
 // approximate screen hit zones matching pump positions
 const pos=[[.18,-.25],[.62,-.25],[1.05,-.25],[.18,.42],[.62,.42],[1.05,.42]];
 let best=0,bd=999;
 pos.forEach((v,i)=>{const p=iso(v[0],v[1],.4);const d=Math.hypot(px-p.x,py-p.y);if(d<bd){bd=d;best=i+1}});
 return bd<55?best:0;
}

c.addEventListener("pointerdown",e=>{
 drag=true;lastX=e.clientX;lastY=e.clientY;
 const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 const p=hitPump(x,y);
 if(p){selected=p;document.getElementById("selected").textContent="Surtidor "+p+" seleccionado";msg("Surtidor "+p+" seleccionado. Pulsa Repostar.");renderUI()}
});
c.addEventListener("pointermove",e=>{
 if(!drag)return;
 camX+=e.clientX-lastX;camY+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY
});
c.addEventListener("pointerup",()=>drag=false);
c.addEventListener("pointercancel",()=>drag=false);
c.addEventListener("wheel",e=>{e.preventDefault();zoom=Math.max(.72,Math.min(1.35,zoom-e.deltaY*.0008))},{passive:false});

document.getElementById("price").addEventListener("input",e=>{price=+e.target.value;renderUI()});
document.getElementById("refuel").addEventListener("click",()=>{
 if(!selected){msg("Toca primero un surtidor.");return}
 if(stock<40){msg("No tienes suficiente combustible.");return}
 stock-=40;money+=40*price;rep=Math.min(100,rep+.4);clients++;fuelLiters=40;
 log("Cliente repostado en surtidor "+selected+": <b>40 L</b> · <b>+"+Math.round(40*price)+" €</b>.");
 msg("¡Cliente atendido! Has cobrado la venta.");renderUI()
});
document.getElementById("attend").addEventListener("click",()=>{clients++;rep=Math.min(100,rep+.2);log("Has atendido a un cliente.");msg("Cliente atendido. Otro coche entra en la estación.");renderUI()});
document.getElementById("buy").addEventListener("click",()=>{if(money<900){msg("No tienes 900 €.");return}money-=900;stock+=1000;log("Camión cisterna: <b>+1.000 L</b>.");msg("Depósito rellenado.");renderUI()});
document.getElementById("upgrade").addEventListener("click",()=>{if(money<1800){msg("Necesitas 1.800 €.");return}money-=1800;log("Has construido una ampliación de surtidores.");msg("Nueva ampliación instalada.");renderUI()});
document.getElementById("close").addEventListener("click",()=>{const profit=Math.max(0,Math.round((rep-30)*2*price*.12));money+=profit;day++;market=Math.max(1.4,Math.min(1.8,market+(Math.random()-.5)*.05));log("Jornada cerrada: <b>+"+Math.round(profit)+" €</b>.");msg("Nueva jornada. La competencia ha cambiado sus precios.");renderUI()});
document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click",()=>{mode=b.dataset.m;document.querySelectorAll(".mode").forEach(x=>x.style.background="#0d2119ec");b.style.background="#163d2b";msg(mode==="price"?"Toca un surtidor para gestionarlo.":mode==="upgrade"?"Aquí podrás ampliar la gasolinera.":"Aquí podrás gestionar la tienda.")}));

resize();renderUI();
})();
</script>
</body>
</html>
