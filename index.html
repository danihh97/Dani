<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AhorraFuel — Gas Station Tycoon</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#07100c;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
#game{position:relative;width:100%;height:100vh;min-height:620px;overflow:hidden;background:#8fbcb0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:7px;flex-wrap:wrap;pointer-events:none}
.stat{background:#0a1c14eF;border:1px solid #526d60;border-radius:14px;padding:8px 11px;min-width:94px;backdrop-filter:blur(8px)}
.stat b{display:block;font-size:15px}.stat span{font-size:9px;color:#a9beb5}
.bottom{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.side{display:flex;flex-direction:column;gap:7px;pointer-events:auto}
button{border:1px solid #5a7468;background:#0a1c14ed;color:#fff;border-radius:13px;padding:11px 14px;min-height:45px;font-weight:850;font-size:12px;touch-action:manipulation}
button.green{background:#3fe482;color:#06140b;border-color:#9af6bd}
button.yellow{background:#ffd15a;color:#151008}
button.selected{border-color:#3fe482;background:#153c2b}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#0a1c14ee;border:1px solid #526d60;border-radius:13px;padding:10px 14px;font-size:11px;max-width:45%;text-align:center;pointer-events:none}
#pricePanel{position:absolute;left:50%;top:92px;transform:translateX(-50%);width:min(370px,72%);background:#0a1c14ee;border:1px solid #526d60;border-radius:15px;padding:10px;display:none;backdrop-filter:blur(8px)}
#pricePanel .line{display:flex;justify-content:space-between}.price{font-size:21px;font-weight:950}
#priceRange{width:100%;accent-color:#3fe482}
#selected{font-size:10px;color:#a9beb5}
@media(max-width:600px){
 .stat{min-width:calc(50% - 4px)}
 #toast{max-width:43%;font-size:9px}
 button{padding:10px 11px}
}
</style>
</head>
<body>
<div id="game">
<canvas id="canvas"></canvas>

<div class="hud">
 <div class="stat"><b id="money">12.540 €</b><span>DINERO</span></div>
 <div class="stat"><b id="fuel">3.250 L</b><span>COMBUSTIBLE</span></div>
 <div class="stat"><b id="rep">72%</b><span>REPUTACIÓN</span></div>
 <div class="stat"><b id="clients">8</b><span>CLIENTES</span></div>
</div>

<div id="pricePanel">
 <div class="line"><strong>Gasolina 95</strong><strong class="price" id="priceText">1,549 €/L</strong></div>
 <input id="priceRange" type="range" min="1.25" max="1.95" step=".001" value="1.549">
 <div id="selected">Toca un surtidor para seleccionarlo</div>
</div>

<div class="bottom">
 <div class="side">
  <button class="menu selected" data-mode="station">Gasolinera</button>
  <button class="menu" data-mode="upgrade">Construir</button>
  <button class="menu" data-mode="shop">Tienda</button>
 </div>
 <div class="side">
  <button id="attend">Atender cliente</button>
  <button id="refuel" class="green">Repostar</button>
  <button id="buy">Comprar combustible</button>
  <button id="day" class="yellow">Cerrar jornada</button>
 </div>
</div>
<div id="toast">Toca un surtidor o un coche.</div>
</div>

<script>
(()=>{"use strict";
const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");
let W=0,H=0,dpr=1,zoom=1,panX=0,panY=0,drag=false,lastX=0,lastY=0;
let money=12540,fuel=3250,rep=72,clients=8,price=1.549,market=1.579,day=12,selected=0,mode="station";
let fueling=false,progress=0;

const pumps=[
 {id:1,x:-.48,y:-.22},{id:2,x:-.16,y:-.22},{id:3,x:.16,y:-.22},
 {id:4,x:-.48,y:.18},{id:5,x:-.16,y:.18},{id:6,x:.16,y:.18}
];
const cars=[
 {x:-1.25,y:.72,tx:-.16,ty:-.22,c:"#3b83bd",s:0.8},
 {x:1.28,y:.82,tx:.16,ty:.18,c:"#d95252",s:0.9},
 {x:-1.15,y:.92,tx:-.48,ty:.18,c:"#f0c84d",s:1},
 {x:1.25,y:.63,tx:.16,ty:-.22,c:"#e8e8e8",s:.75},
 {x:-1.3,y:.58,tx:-.48,ty:-.22,c:"#7a67b6",s:.72}
];
let trees=[];
for(let i=0;i<22;i++)trees.push({x:-1.55+Math.random()*3.1,y:.1+Math.random()*.9,s:.65+Math.random()*.35});

function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
function iso(x,y,z=0){
 return {x:W/2+(x-y)*W*.27*zoom+panX,y:H*.51+(x+y)*H*.15*zoom-z*H*.115*zoom+panY};
}
function poly(a,fill,stroke="#0000",lw=1){ctx.beginPath();a.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke!="#0000"){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function cube(x,y,z,w,d,h,top,left,right){
 const a=iso(x,y,z),b=iso(x+w,y,z),c=iso(x+w,y+d,z),d1=iso(x,y+d,z);
 const A=iso(x,y,z+h),B=iso(x+w,y,z+h),C=iso(x+w,y+d,z+h),D=iso(x,y+d,z+h);
 poly([a,b,c,d1],top);poly([d1,c,C,D],right);poly([a,b,B,A],left);poly([A,B,C,D],top);
}
function shadow(x,y,w,d){
 const a=iso(x,y,.01),b=iso(x+w,y+d,.01);ctx.fillStyle="#17221c55";ctx.beginPath();ctx.ellipse((a.x+b.x)/2,(a.y+b.y)/2,Math.abs(b.x-a.x)*.55+10,Math.abs(b.y-a.y)*.24+5,-.15,0,Math.PI*2);ctx.fill();
}
function txt(t,x,y,size,color="#fff"){ctx.fillStyle=color;ctx.font=`800 ${size}px system-ui`;ctx.textAlign="center";ctx.fillText(t,x,y)}

function tree(t){
 const p=iso(t.x,t.y,.05),s=28*t.s*zoom;
 ctx.fillStyle="#704a31";ctx.fillRect(p.x-3,p.y-s*.05,6,s*.7);
 ctx.fillStyle="#347c48";ctx.beginPath();ctx.arc(p.x,p.y-s*.42,s*.62,0,7);ctx.fill();
 ctx.fillStyle="#58a55f";ctx.beginPath();ctx.arc(p.x-s*.16,p.y-s*.6,s*.38,0,7);ctx.fill();
}
function car(q){
 const p=iso(q.x,q.y,.08),s=46*q.s*zoom;
 ctx.save();ctx.translate(p.x,p.y);
 ctx.fillStyle="#14201b66";ctx.beginPath();ctx.ellipse(0,8,s*.68,s*.23,0,0,7);ctx.fill();
 poly([{x:-s*.58,y:0},{x:s*.58,y:0},{x:s*.48,y:-s*.28},{x:-s*.42,y:-s*.28}],q.c,"#1a2923",2);
 poly([{x:-s*.34,y:-s*.29},{x:s*.25,y:-s*.29},{x:s*.13,y:-s*.53},{x:-s*.2,y:-s*.53}],"#8cc5cc","#233b34",1);
 ctx.fillStyle="#111";for(const xx of [-.39,.39]){ctx.beginPath();ctx.arc(xx*s,2,s*.12,0,7);ctx.fill()}
 ctx.restore();
}
function pump(p){
 const q=iso(p.x,p.y,.05),s=35*zoom;
 if(selected===p.id){ctx.strokeStyle="#3fe482";ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(q.x,q.y+3,s*.55,s*.28,0,0,7);ctx.stroke()}
 shadow(p.x,p.y,.3,.24);
 cube(p.x-.14,p.y-.1,.05,.28,.22,.65,"#eef2ef","#c7d0cb","#aebbb5");
 const top=iso(p.x-.14,p.y-.1,.7);ctx.fillStyle="#153b2a";ctx.fillRect(top.x-8,top.y-4,16,6);
}

function draw(){
 ctx.clearRect(0,0,W,H);
 const sky=ctx.createLinearGradient(0,0,0,H*.5);sky.addColorStop(0,"#88b9ad");sky.addColorStop(1,"#d1ded0");ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 ctx.fillStyle="#ffe28d";ctx.beginPath();ctx.arc(W*.84,H*.13,25,0,7);ctx.fill();
 // mountains
 poly([{x:0,y:H*.40},{x:W*.14,y:H*.22},{x:W*.28,y:H*.37},{x:W*.44,y:H*.18},{x:W*.61,y:H*.36},{x:W*.77,y:H*.21},{x:W,y:H*.37},{x:W,y:H*.55},{x:0,y:H*.55}],"#72938b");
 // ground
 poly([{x:0,y:H*.48},{x:W*.5,y:H*.29},{x:W,y:H*.48},{x:W,y:H},{x:0,y:H}],"#687870");
 // road
 poly([{x:W*.08,y:H},{x:W*.36,y:H*.46},{x:W*.64,y:H*.46},{x:W*.92,y:H}],"#303a36");
 ctx.strokeStyle="#d9dfdbbb";ctx.lineWidth=4;ctx.setLineDash([17,16]);ctx.beginPath();ctx.moveTo(W*.22,H);ctx.lineTo(W*.46,H*.48);ctx.moveTo(W*.78,H);ctx.lineTo(W*.54,H*.48);ctx.stroke();ctx.setLineDash([]);
 // trees rear
 trees.filter(t=>t.y<.55).forEach(tree);
 // shop
 shadow(-.72,-.38,1.08,.72);
 cube(-.72,-.38,.05,1.15,.7,.68,"#edf1ee","#c5cec8","#afb9b3");
 cube(-.78,-.44,.73,1.27,.82,.10,"#17261f","#17261f","#17261f");
 // windows
 const a=iso(-.67,-.445,.35),b=iso(.28,-.445,.35),c=iso(.28,-.445,.57),d=iso(-.67,-.445,.57);poly([a,b,c,d],"#68aeb9","#355b55",1);
 txt("TIENDA",W*.38,H*.54,11,"#143328");
 // canopy
 shadow(-.02,-.35,1.45,1.18);
 cube(-.02,-.38,.72,1.65,1.28,.10,"#36df78","#218f51","#218f51");
 [[.04,-.31],[1.38,-.31],[.04,.75],[1.38,.75]].forEach(v=>cube(v[0],v[1],.05,.07,.07,.67,"#edf1ee","#c5cec8","#afb9b3"));
 txt("AHORRAFUEL",W*.62,H*.43,13,"#063019");
 // pumps
 pumps.forEach(pump);
 // chargers
 [1.52,1.78].forEach(x=>{const p=iso(x,.55,.05);ctx.fillStyle="#35df79";ctx.fillRect(p.x-7,p.y-7,14,8);ctx.fillStyle="#eef2ef";ctx.fillRect(p.x-3,p.y-30,6,24)});
 // tanker
 cube(-1.55,.72,.05,.58,.92,.48,"#e8eeea","#b9c4bd","#aab5ae");cube(-1.48,.72,.55,.48,.82,.07,"#35df79","#218f51","#218f51");
 // trees front
 trees.filter(t=>t.y>=.55).forEach(tree);
 cars.forEach(car);
 // customer at selected pump
 if(selected){const p=pumps[selected-1],q=iso(p.x,p.y,.8);ctx.fillStyle="#d79a70";ctx.beginPath();ctx.arc(q.x,q.y-13,5,0,7);ctx.fill();ctx.fillStyle="#397695";ctx.fillRect(q.x-7,q.y-8,14,17);txt("CLIENTE",q.x,q.y-23,7,"#0b2218")}
 requestAnimationFrame(draw);
}

function ui(){
 document.getElementById("money").textContent=Math.round(money).toLocaleString("es-ES")+" €";
 document.getElementById("fuel").textContent=Math.round(fuel).toLocaleString("es-ES")+" L";
 document.getElementById("rep").textContent=Math.round(rep)+"%";
 document.getElementById("clients").textContent=clients;
 document.getElementById("priceText").textContent=price.toFixed(3).replace(".",",")+" €/L";
}
function toast(t){document.getElementById("toast").textContent=t}

function pumpAt(x,y){
 let best=0,dist=999,pos=pumps.map(p=>iso(p.x,p.y,.4));
 pos.forEach((p,i)=>{const d=Math.hypot(x-p.x,y-p.y);if(d<dist){dist=d;best=i+1}});
 return dist<55?best:0;
}
canvas.addEventListener("pointerdown",e=>{
 drag=true;lastX=e.clientX;lastY=e.clientY;
 const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 const p=pumpAt(x,y);
 if(p){selected=p;document.getElementById("pricePanel").style.display="block";document.getElementById("selected").textContent="Surtidor "+p+" seleccionado";toast("Surtidor "+p+" seleccionado. Pulsa Repostar.");}
});
canvas.addEventListener("pointermove",e=>{if(drag){panX+=e.clientX-lastX;panY+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY}});
canvas.addEventListener("pointerup",()=>drag=false);canvas.addEventListener("pointercancel",()=>drag=false);
canvas.addEventListener("wheel",e=>{e.preventDefault();zoom=Math.max(.7,Math.min(1.4,zoom-e.deltaY*.0008))},{passive:false});

document.getElementById("priceRange").addEventListener("input",e=>{price=+e.target.value;ui()});
document.getElementById("refuel").onclick=()=>{
 if(!selected)return toast("Toca primero un surtidor.");
 if(fueling)return toast("Ya estás repostando.");
 if(fuel<40)return toast("No tienes suficiente combustible.");
 fueling=true;progress=0;toast("Repostando cliente…");
 const timer=setInterval(()=>{
  progress+=2;fuel-=2;ui();
  if(progress>=40){clearInterval(timer);fueling=false;money+=40*price;rep=Math.min(100,rep+.4);clients++;toast("¡Repostaje terminado! +"+Math.round(40*price)+" €");ui()}
 },90);
};
document.getElementById("attend").onclick=()=>{clients++;rep=Math.min(100,rep+.2);toast("Cliente atendido. Entra otro coche.");ui()};
document.getElementById("buy").onclick=()=>{if(money<900)return toast("Necesitas 900 €.");money-=900;fuel+=1000;toast("Has recibido 1.000 L de combustible.");ui()};
document.getElementById("day").onclick=()=>{const p=Math.max(0,Math.round((rep-30)*2*price*.12));money+=p;day++;market=Math.max(1.4,Math.min(1.8,market+(Math.random()-.5)*.05));toast("Día "+day+" iniciado. Beneficio: +"+p+" €");ui()};
document.querySelectorAll(".menu").forEach(b=>b.onclick=()=>{document.querySelectorAll(".menu").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");mode=b.dataset.mode;toast(mode==="station"?"Gestiona la gasolinera.":mode==="upgrade"?"Aquí construiremos nuevas instalaciones.":"Aquí gestionaremos la tienda.")});

resize();ui();requestAnimationFrame(draw);
window.addEventListener("resize",resize);
})();
</script>
</body>
</html>
